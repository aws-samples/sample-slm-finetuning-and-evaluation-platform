[project]
name = "slm-platform-backend"
version = "0.1.0"
description = "FastAPI backend for the SLM fine-tune/eval platform (local test UI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sagemaker>=2.220,<3",
    "boto3>=1.34",
    "mangum>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests target pure logic with the store on a temp dir; no AWS calls.
addopts = "-q"
